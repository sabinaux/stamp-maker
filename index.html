<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stamp Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6DDFA;--panel:#F3F3F3;--ink:#3B1F4A;--muted:#7A5C86;--accent:#6C5CE7;--stage:#DEDEDE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--panel:#262626;--ink:#F2F2F2;--muted:#B5B5B5;--accent:#9A8DFF;--stage:#383838}}
:root[data-theme="dark"]{--bg:#161616;--panel:#262626;--ink:#F2F2F2;--muted:#B5B5B5;--accent:#9A8DFF;--stage:#383838}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:clamp(2.2rem,8vw,3.2rem);margin:0 0 4px;line-height:1;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.stage{background:var(--stage);border:3px solid var(--ink);border-radius:22px;padding:28px 16px;display:grid;place-items:center;box-shadow:5px 5px 0 var(--ink)}
.stamp{position:relative;width:min(100%,340px);aspect-ratio:360/440;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.28))}
.stamp svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:22px;padding:16px;box-shadow:5px 5px 0 var(--ink)}
.panel h2{font-size:1.05rem;margin:14px 0 8px}
.panel h2:first-child{margin-top:0}
label{display:flex;justify-content:space-between;font-size:.92rem;margin-top:8px}
label output{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row label{margin:0;gap:6px;align-items:center;justify-content:flex-start}
input[type=color]{width:38px;height:32px;border:2px solid var(--ink);border-radius:8px;padding:0;background:none;cursor:pointer}
button,select{font:inherit;font-size:.92rem;padding:7px 12px;border-radius:12px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
button.on{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=file]{font:inherit;font-size:.85rem;max-width:100%}
p.hint{font-size:.82rem;color:var(--muted);margin:8px 0 0}
footer{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
footer img{width:96px;height:96px;display:block}
</style>
</head>
<body>
<main>
  <h1>Stamp maker</h1>
  <p class="sub">Shape the edge, then draw or drop in an image.</p>
  <div class="wrap">
    <div class="stage">
      <div class="stamp" id="stamp">
        <svg id="svg" viewBox="0 0 360 440" aria-label="Stamp preview"></svg>
        <canvas id="cv" width="720" height="880"></canvas>
      </div>
    </div>
    <div class="panel">
      <h2>Edge</h2>
      <label>Perforations across <output id="o_n"></output></label>
      <input type="range" id="n" min="4" max="24" value="12">
      <label>Hole size <output id="o_h"></output></label>
      <input type="range" id="h" min="15" max="48" value="38">
      <label>Corner curve <output id="o_c"></output></label>
      <input type="range" id="c" min="0" max="70" value="18">
      <div class="row"><label>Corner style
        <select id="cs"><option value="classic">Square (classic)</option><option value="round">Rounded</option><option value="scoop">Scooped</option></select></label></div>
      <label>Paper margin <output id="o_m"></output></label>
      <input type="range" id="m" min="14" max="60" value="30">
      <div class="row"><label>Paper <input type="color" id="paper" value="#FFFDF5"></label>
      <label>Art background <input type="color" id="artbg" value="#BDE7F5"></label></div>
      <h2>Border</h2>
      <div class="row"><label>Style
        <select id="fs"><option value="none">None</option><option value="single">Single</option><option value="double">Double</option></select></label>
        <label>Color <input type="color" id="fc" value="#B5A163"></label></div>
      <label>Border thickness <output id="o_f"></output></label>
      <input type="range" id="fw" min="2" max="20" value="8">
      <h2>Artwork</h2>
      <div class="row"><button id="bDraw" class="on">Draw</button><button id="bErase">Erase</button><label>Ink <input type="color" id="ink" value="#3B1F4A"></label></div>
      <label>Brush size <output id="o_b"></output></label>
      <input type="range" id="b" min="2" max="40" value="8">
      <div class="row"><button id="clr">Clear drawing</button></div>
      <h2>Image</h2>
      <input type="file" id="file" accept="image/*" aria-label="Add an image">
      <div class="row"><button id="rmimg">Remove image</button></div>
      <h2>Save</h2>
      <div class="row"><button id="save" class="on">Save stamp as PNG</button></div>
      <p class="hint">Saves a transparent PNG with your perforations cut out.</p>
    </div>
  </div>
  <footer>

<script>
const W=360,H=440,$=id=>document.getElementById(id);
const svg=$('svg'),cv=$('cv'),ctx=cv.getContext('2d');
let imgData='';
function render(){
  const n=+$('n').value,hp=+$('h').value,cr=+$('c').value,m=+$('m').value,scoop=$('cs').value==='scoop',classic=$('cs').value==='classic';
  $('o_n').textContent=n;$('o_h').textContent=hp+'%';$('o_c').textContent=cr;$('o_m').textContent=m;$('o_b').textContent=$('b').value;$('o_f').textContent=$('fw').value;$('c').disabled=classic;
  let px,py,ny;
  if(classic){px=W/(n+2);ny=Math.max(2,Math.round(H/px)-2);py=H/(ny+2)}else{px=W/n;ny=Math.max(2,Math.round(n*H/W));py=H/ny}
  const off=classic?1.5:.5,r=Math.min(px,py)*hp/100;
  let holes='';
  for(let i=0;i<n;i++){const x=(i+off)*px;holes+=`<circle cx="${x}" cy="0" r="${r}"/><circle cx="${x}" cy="${H}" r="${r}"/>`}
  for(let j=0;j<ny;j++){const y=(j+off)*py;holes+=`<circle cx="0" cy="${y}" r="${r}"/><circle cx="${W}" cy="${y}" r="${r}"/>`}
  if(scoop&&cr>0)holes+=[[0,0],[W,0],[0,H],[W,H]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${cr}"/>`).join('');
  const rx=(scoop||classic)?0:cr,aw=W-2*m,ah=H-2*m,ar=Math.max(0,rx-m*.6);
  window._g={m,aw,ah,ar};
  const fs=$('fs').value,fw=+$('fw').value,fc=$('fc').value;let frame='';
  if(fs==='single')frame=`<rect x="${m+fw/2}" y="${m+fw/2}" width="${aw-fw}" height="${ah-fw}" rx="${Math.max(0,ar-fw/2)}" fill="none" stroke="${fc}" stroke-width="${fw}"/>`;
  if(fs==='double'){const th=Math.max(1.5,fw/3),o=fw+fw*.6+th/2;frame=`<rect x="${m+fw/2}" y="${m+fw/2}" width="${aw-fw}" height="${ah-fw}" rx="${Math.max(0,ar-fw/2)}" fill="none" stroke="${fc}" stroke-width="${fw}"/><rect x="${m+o}" y="${m+o}" width="${aw-2*o}" height="${ah-2*o}" rx="${Math.max(0,ar-o)}" fill="none" stroke="${fc}" stroke-width="${th}"/>`}
  svg.innerHTML=`<defs><mask id="mk"><rect width="${W}" height="${H}" rx="${rx}" fill="#fff"/><g fill="#000">${holes}</g></mask>
  <clipPath id="ac"><rect x="${m}" y="${m}" width="${aw}" height="${ah}" rx="${ar}"/></clipPath></defs>
  <rect width="${W}" height="${H}" fill="${$('paper').value}" mask="url(#mk)"/>
  <rect x="${m}" y="${m}" width="${aw}" height="${ah}" rx="${ar}" fill="${$('artbg').value}"/>
  ${imgData?`<image href="${imgData}" x="${m}" y="${m}" width="${aw}" height="${ah}" preserveAspectRatio="xMidYMid slice" clip-path="url(#ac)"/>`:''}${frame}`;
  cv.style.clipPath=`inset(${m/H*100}% ${m/W*100}% ${m/H*100}% ${m/W*100}% round ${ar/W*100}%)`;
}
['n','h','c','m','cs','paper','artbg','b','fs','fc','fw'].forEach(id=>$(id).addEventListener('input',render));
let erase=false,drawing=false,last=null;
function setMode(e){erase=e;$('bErase').classList.toggle('on',e);$('bDraw').classList.toggle('on',!e)}
$('bDraw').onclick=()=>setMode(false);$('bErase').onclick=()=>setMode(true);
$('clr').onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
$('rmimg').onclick=()=>{imgData='';$('file').value='';render()};
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();fr.onload=()=>{imgData=fr.result;render()};fr.readAsDataURL(f);
});
function pt(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}}
function seg(a,b){
  ctx.globalCompositeOperation=erase?'destination-out':'source-over';
  ctx.strokeStyle=$('ink').value;ctx.lineWidth=+$('b').value*2;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}
cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pt(e);seg(last,{x:last.x+.01,y:last.y})});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);seg(last,p);last=p});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drawing=false}));
async function stampBlob(sc){
  const g=window._g,c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;const x=c.getContext('2d');
  const clone=svg.cloneNode(true);clone.setAttribute('width',W);clone.setAttribute('height',H);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone))});
  x.drawImage(img,0,0,c.width,c.height);
  x.save();x.beginPath();
  if(x.roundRect)x.roundRect(g.m*sc,g.m*sc,g.aw*sc,g.ah*sc,g.ar*sc);else x.rect(g.m*sc,g.m*sc,g.aw*sc,g.ah*sc);
  x.clip();x.drawImage(cv,0,0,c.width,c.height);x.restore();
  return new Promise(res=>c.toBlob(res,'image/png'));
}
$('save').addEventListener('click',async()=>{
  const btn=$('save');btn.disabled=true;
  try{
    const blob=await stampBlob(3);let done=false;
    try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename:'my-stamp.png',data:blob});done=true}}}
    catch(e){if(e&&e.code==='declined'){btn.disabled=false;return}}
    if(!done){
      const file=new File([blob],'my-stamp.png',{type:'image/png'});
      if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-stamp.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
    }
  }catch(e){}
  btn.disabled=false;
});
render();
</script>
